<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/cyber :: head('Estudiante')}"></head>
<body>
<div th:replace="~{fragments/cyber :: bg}"></div>
<div class="shell">
  <div th:replace="~{fragments/cyber :: sidebar('est')}"></div>
  <main class="main">
    <div class="ptitle"><h2>👤 Estudiante</h2></div>

    <section class="panel in" style="max-width:820px">
      <form th:action="@{/coordinacion/estudiantes/guardar}" th:object="${estudiante}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="fgrid" style="grid-template-columns:repeat(3,1fr)">
          <div class="field">
            <label>Tipo doc.</label>
            <input type="text" th:field="*{tipoDocumento}" class="ctrl"/>
          </div>
          <div class="field">
            <label>N° documento</label>
            <input type="text" th:field="*{numeroDocumento}" class="ctrl"/>
          </div>
          <div class="field">
            <label>N° registro ICFES</label>
            <input type="text" th:field="*{numeroRegistro}" class="ctrl"/>
          </div>

          <div class="field">
            <label>Primer apellido</label>
            <input type="text" th:field="*{primerApellido}" class="ctrl" th:classappend="${#fields.hasErrors('primerApellido')}?'bad'"/>
            <div class="err-msg" th:if="${#fields.hasErrors('primerApellido')}" th:errors="*{primerApellido}"></div>
          </div>
          <div class="field">
            <label>Segundo apellido</label>
            <input type="text" th:field="*{segundoApellido}" class="ctrl"/>
          </div>
          <div class="field">
            <label>Primer nombre</label>
            <input type="text" th:field="*{primerNombre}" class="ctrl"/>
          </div>
          <div class="field">
            <label>Segundo nombre</label>
            <input type="text" th:field="*{segundoNombre}" class="ctrl"/>
          </div>
          <div class="field">
            <label>Correo</label>
            <input type="email" th:field="*{correo}" class="ctrl"/>
          </div>
          <div class="field">
            <label>Teléfono</label>
            <input type="text" th:field="*{telefono}" class="ctrl"/>
          </div>
          <div class="field ffull">
            <label>Facultad</label>
            <select th:field="*{facultad}" class="ctrl">
              <option value="">-- Seleccione --</option>
              <option th:each="f : ${facultades}" th:value="${f.id}" th:text="${f.nombre}"></option>
            </select>
          </div>
          <div class="field ffull">
            <label class="check"><input type="checkbox" th:field="*{aprobadoSaberPro}"/> Aprobado para presentar Saber Pro</label>
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:22px">
          <button type="submit" class="btn btn-primary">💾 Guardar</button>
          <a href="/coordinacion/estudiantes/listar" class="btn btn-ghost">Cancelar</a>
        </div>
      </form>
    </section>
  </main>
</div>
<div th:replace="~{fragments/cyber :: scripts}"></div>
</body>
</html>
