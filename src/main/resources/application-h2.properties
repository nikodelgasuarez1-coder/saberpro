# ===== Perfil H2 (para desplegar en la nube sin base de datos externa) =====
# Se activa con la variable de entorno: SPRING_PROFILES_ACTIVE=h2
# La base vive en memoria dentro de la propia app (igual que el proyecto futbol_v2).

spring.datasource.url=jdbc:h2:mem:saberprodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Consola web de H2 para ver la base en el navegador (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
