# ===== Servidor =====
# En local usa 8089; en Render se inyecta el puerto por la variable PORT
server.port=${PORT:8089}

# ===== Base de datos =====
# En local apunta a MySQL de XAMPP (root sin password).
# En la nube (Render / MySQL online) se sobreescribe con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/saberpro?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# El dialecto se auto-detecta según la base (MySQL local / H2 en la nube).

# ===== Subida de archivos (recibos de pago / Excel) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Carpeta donde se guardan los recibos de pago subidos
app.upload.dir=${UPLOAD_DIR:uploads}
